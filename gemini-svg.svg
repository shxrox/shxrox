<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 610" width="1180" height="610">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow1" cx="20%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="bgGlow2" cx="80%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>

    <!-- ASCII & Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED">
        <animate attributeName="stop-color" values="#7C3AED;#22D3EE;#10B981;#7C3AED" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#22D3EE">
        <animate attributeName="stop-color" values="#22D3EE;#10B981;#7C3AED;#22D3EE" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#10B981">
        <animate attributeName="stop-color" values="#10B981;#7C3AED;#22D3EE;#10B981" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Typing Mask for roles animation -->
    <clipPath id="typingClip">
      <rect x="0" y="0" width="0" height="50">
        <animate attributeName="width" values="0;400;400;0" keyTimes="0;0.4;0.9;1" dur="6s" repeatCount="indefinite" />
      </rect>
    </clipPath>
  </defs>

  <!-- Base Background -->
  <rect width="1180" height="610" fill="#030712" rx="20"/>
  <rect width="1180" height="610" fill="url(#bgGlow1)" rx="20"/>
  <rect width="1180" height="610" fill="url(#bgGlow2)" rx="20"/>

  <!-- LEFT SIDE: ASCII Portrait (38%) -->
  <g transform="translate(30, 30)">
    <!-- Glass Panel -->
    <rect width="420" height="550" fill="#0F172A" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" rx="16" />
    
    <!-- Floating ASCII Group -->
    <g fill="url(#accentGrad)" font-family="monospace" font-size="12" font-weight="bold" filter="url(#glow)">
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-8; 0,0" dur="5s" repeatCount="indefinite" />
      
      <!-- ASCII Art Lines -->
      <text x="40" y="100">      /\_/\       </text>
      <text x="40" y="120">    =( °w° )=     </text>
      <text x="40" y="140">      )   (  //   </text>
      <text x="40" y="160">     (__ __)//    </text>
      <text x="40" y="200"> SYSTEM STATUS: </text>
      <text x="40" y="220"> [██████████] 100% </text>
      <text x="40" y="260"> INITIALIZING... </text>
      <text x="40" y="280"> LOADING MODULES... </text>
      
      <!-- Scanline -->
      <line x1="20" x2="400" y1="50" y2="50" stroke="rgba(34,211,238,0.4)" stroke-width="2">
        <animate attributeName="y1" values="50; 500; 50" dur="4s" repeatCount="indefinite" />
        <animate attributeName="y2" values="50; 500; 50" dur="4s" repeatCount="indefinite" />
      </line>
    </g>
  </g>

  <!-- RIGHT SIDE: Terminal (62%) -->
  <g transform="translate(480, 30)">
    <!-- Glass Panel -->
    <rect width="670" height="550" fill="#0F172A" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" rx="16" />
    
    <!-- Terminal Header Buttons -->
    <circle cx="30" cy="30" r="6" fill="#EF4444" />
    <circle cx="50" cy="30" r="6" fill="#F59E0B" />
    <circle cx="70" cy="30" r="6" fill="#10B981" />
    <line x1="20" y1="55" x2="650" y2="55" stroke="rgba(255,255,255,0.05)" stroke-width="1" />

    <!-- Greeting -->
    <text x="30" y="110" fill="#F8FAFC" font-family="sans-serif" font-size="32" font-weight="bold">Hi, I'm Sharon Devasudan</text>
    
    <!-- Typing Animation Container -->
    <g transform="translate(30, 140)">
      <!-- Animated Text Cycle -->
      <g clip-path="url(#typingClip)">
        <text x="0" y="0" fill="url(#accentGrad)" font-family="monospace" font-size="24">
          > Software Engineer_
          <animate attributeName="opacity" values="1;1;0;0;0;0" keyTimes="0;0.33;0.34;0.66;0.67;1" dur="18s" repeatCount="indefinite" />
        </text>
        <text x="0" y="0" fill="url(#accentGrad)" font-family="monospace" font-size="24" opacity="0">
          > Full-Stack Developer_
          <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.33;0.34;0.66;0.67;1" dur="18s" repeatCount="indefinite" />
        </text>
        <text x="0" y="0" fill="url(#accentGrad)" font-family="monospace" font-size="24" opacity="0">
          > MERN &amp; AI Enthusiast_
          <animate attributeName="opacity" values="0;0;0;0;1;1" keyTimes="0;0.33;0.34;0.66;0.67;1" dur="18s" repeatCount="indefinite" />
        </text>
      </g>
    </g>

    <!-- Info List -->
    <g font-family="sans-serif" font-size="16" transform="translate(30, 220)">
      <text x="0" y="0" fill="#94A3B8">📍 Location:</text>
      <text x="140" y="0" fill="#F8FAFC">Colombo, Sri Lanka</text>
      
      <text x="0" y="40" fill="#94A3B8">🎓 Education:</text>
      <text x="140" y="40" fill="#F8FAFC">BSc in Software Engineering</text>
      
      <text x="0" y="80" fill="#94A3B8">⚡ Current Focus:</text>
      <text x="140" y="80" fill="#F8FAFC">Full-Stack Dev &amp; AI Solutions</text>
      
      <text x="0" y="120" fill="#94A3B8">💼 Portfolio:</text>
      <text x="140" y="120" fill="#F8FAFC">shxrox.github.io/portfolio</text>
    </g>

    <!-- Skills Section (Glowing Pills) -->
    <text x="30" y="380" fill="#F8FAFC" font-family="sans-serif" font-size="20" font-weight="bold">Tech Stack</text>
    
    <g transform="translate(30, 410)">
      <!-- Row 1 -->
      <g>
        <rect x="0" y="0" width="90" height="32" rx="16" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
        <text x="45" y="21" fill="#F8FAFC" font-family="sans-serif" font-size="13" text-anchor="middle">React.js</text>
      </g>
      <g transform="translate(100, 0)">
        <rect x="0" y="0" width="105" height="32" rx="16" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
        <text x="52.5" y="21" fill="#F8FAFC" font-family="sans-serif" font-size="13" text-anchor="middle">TypeScript</text>
      </g>
      <g transform="translate(215, 0)">
        <rect x="0" y="0" width="90" height="32" rx="16" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
        <text x="45" y="21" fill="#F8FAFC" font-family="sans-serif" font-size="13" text-anchor="middle">Node.js</text>
      </g>
      <g transform="translate(315, 0)">
        <rect x="0" y="0" width="100" height="32" rx="16" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
        <text x="50" y="21" fill="#F8FAFC" font-family="sans-serif" font-size="13" text-anchor="middle">Express.js</text>
      </g>

      <!-- Row 2 -->
      <g transform="translate(0, 45)">
        <rect x="0" y="0" width="70" height="32" rx="16" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
        <text x="35" y="21" fill="#F8FAFC" font-family="sans-serif" font-size="13" text-anchor="middle">Java</text>
      </g>
      <g transform="translate(80, 45)">
        <rect x="0" y="0" width="105" height="32" rx="16" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
        <text x="52.5" y="21" fill="#F8FAFC" font-family="sans-serif" font-size="13" text-anchor="middle">Spring Boot</text>
      </g>
      <g transform="translate(195, 45)">
        <rect x="0" y="0" width="80" height="32" rx="16" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
        <text x="40" y="21" fill="#F8FAFC" font-family="sans-serif" font-size="13" text-anchor="middle">Python</text>
      </g>
      <g transform="translate(285, 45)">
        <rect x="0" y="0" width="85" height="32" rx="16" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
        <text x="42.5" y="21" fill="#F8FAFC" font-family="sans-serif" font-size="13" text-anchor="middle">Jupyter</text>
      </g>

      <!-- Row 3 -->
      <g transform="translate(0, 90)">
        <rect x="0" y="0" width="95" height="32" rx="16" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
        <text x="47.5" y="21" fill="#F8FAFC" font-family="sans-serif" font-size="13" text-anchor="middle">MongoDB</text>
      </g>
      <g transform="translate(105, 90)">
        <rect x="0" y="0" width="80" height="32" rx="16" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
        <text x="40" y="21" fill="#F8FAFC" font-family="sans-serif" font-size="13" text-anchor="middle">MySQL</text>
      </g>
      <g transform="translate(195, 90)">
        <rect x="0" y="0" width="75" height="32" rx="16" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
        <text x="37.5" y="21" fill="#F8FAFC" font-family="sans-serif" font-size="13" text-anchor="middle">HTML5</text>
      </g>
      <g transform="translate(280, 90)">
        <rect x="0" y="0" width="75" height="32" rx="16" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
        <text x="37.5" y="21" fill="#F8FAFC" font-family="sans-serif" font-size="13" text-anchor="middle">CSS3</text>
      </g>
    </g>
  </g>
</svg>
